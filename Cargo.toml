[package]
name = "harness-queue"
version = "0.1.0"
edition = "2021"
authors = ["Romey <romey@example.com>"]
description = "Universal terminal-based agent queue for herdr and Ghostty"

[[bin]]
name = "hq"
path = "src/main.rs"

[lib]
name = "harness_queue"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
